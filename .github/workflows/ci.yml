name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit-tests:
    name: Pruebas unitarias (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Correr pruebas (vitest)
        working-directory: backend
        run: npm test

  e2e:
    name: Pruebas end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Levantar la app con docker compose
        run: docker compose up --build -d

      - name: Esperar a que el backend esté saludable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              echo "Backend listo."
              exit 0
            fi
            echo "Esperando backend... ($i)"
            sleep 2
          done
          echo "El backend nunca quedó saludable."
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Crear usuarios de prueba (seed)
        working-directory: backend
        run: |
          npm ci
          npm run db:seed
        env:
          DATABASE_URL: postgresql://vsj_user:vsj_password@localhost:5432/vsj_db

      - name: Instalar dependencias de Playwright
        run: npm install

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr pruebas end-to-end
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Logs de los servicios (si algo falla)
        if: failure()
        run: docker compose logs

      - name: Apagar los servicios
        if: always()
        run: docker compose down -v
