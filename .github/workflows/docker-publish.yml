name: Publicar imágenes en DockerHub

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

jobs:
  publish-backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/soluciones-vsj-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/soluciones-vsj-backend:${{ github.sha }}

  publish-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=https://soluciones-vsj-production.up.railway.app
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/soluciones-vsj-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/soluciones-vsj-frontend:${{ github.sha }}
